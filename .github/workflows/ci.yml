name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up uv (Python toolchain for the `python` project)
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: pnpm check
